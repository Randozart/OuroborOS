[package]
name = "ouro-agent"
version.workspace = true
edition.workspace = true

[features]
default = ["bitnet"]
bitnet = ["dep:bitnet-rs"]

[dependencies]
ouro-cluster = { path = "../cluster" }
bitnet-rs = { path = "../bitnet-rs", optional = true }
