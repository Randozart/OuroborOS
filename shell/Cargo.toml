[package]
name = "ouro-shell"
version.workspace = true
edition.workspace = true

[dependencies]
ouro-cluster = { path = "../cluster" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tokio = { version = "1", features = ["full"] }

[lib]
name = "ouro_shell"
path = "src/lib.rs"

[dev-dependencies]
bitnet-rs = { path = "../bitnet-rs" }
serde_json.workspace = true

[[bin]]
name = "ouro-shell"
path = "src/main.rs"

[[bin]]
name = "ouro-ttyd"
path = "src/bin/ouro-ttyd.rs"

[[bin]]
name = "ouro-registry"
path = "src/bin/ouro-registry.rs"
