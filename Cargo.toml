[workspace]
members = ["cluster", "shell", "agent", "bitnet-rs", "ouro-wgpu"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
